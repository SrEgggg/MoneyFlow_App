name: savings_app
description: "Track everyday spending, account balances and savings goals with MoneyFlow."
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Database (sqflite for hand-written SQL — no codegen step)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.19.0
  image_picker: ^1.2.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/play-store-icon.png
